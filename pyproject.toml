[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base"
version = "1.0.0"
description = "Local-first knowledge base service with vector search and conversational QA"
readme = "README.md"
requires-python = ">=3.10"
license = "MulanPSL-2.0"
authors = [
  { name = "knowledge-base maintainers" }
]
dynamic = ["dependencies"]

[project.scripts]
knowledge-base = "src.main:_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["dist*", "tests*", "logs*", "models*", "kb_store*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.build.txt"] }

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.html", "*.css", "*.js"]
