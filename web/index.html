<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIKI本地知识库控制台</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="bg-layer"></div>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.png" alt="WIKI logo">
        <div>
          <h1>WIKI本地知识库控制台</h1>
          <p>本地知识库工作台</p>
        </div>
      </div>
      <nav class="menu">
        <a class="menu-item active" href="/ui/">聊天</a>
        <a class="menu-item" href="/ui/kb.html">知识库管理</a>
        <a class="menu-item" href="/ui/model.html">模型管理</a>
      </nav>
      <a class="doc-link" href="/api-docs" target="_blank" rel="noreferrer">查看 API 文档</a>
    </aside>

    <div class="content">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <header class="panel-head">
        <h2>聊天</h2>
        <p>问答基于知识库检索，可选直接生成回答。</p>
      </header>

      <div class="chat-layout">
          <aside class="card chat-history">
            <button id="btn-new-session" class="btn-new-session" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
              <span>新建对话</span>
            </button>
            
            <div class="chat-history-head">
              <h3>历史记录</h3>
              <button id="btn-clear-history" class="btn-icon" type="button" title="清空历史">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
              </button>
            </div>
            
            <ul id="history-list" class="history-list">
              <li class="history-item history-empty">暂无历史</li>
            </ul>
            
            <div class="history-footer">
              仅显示最近 20 条对话
            </div>
          </aside>

          <div class="chat-main">
            <div class="card chat-settings">
              <details>
                <summary><strong>⚙️ 高级设置</strong></summary>
                <div class="settings-grid">
                  <label class="field size-small">
                    <span>用户ID</span>
                    <input id="chat-user-id" type="text" placeholder="user-001" value="user-001" required>
                  </label>
                </div>
              </details>
            </div>
            
            <!-- 隐藏的配置字段,由后台和其他页面管理 -->
            <input id="chat-session-id" type="hidden">
            <input id="chat-k" type="hidden" value="2">
            <input id="chat-threshold" type="hidden" value="">
            <input id="chat-generate" type="hidden" value="true">
            <select id="chat-model-config" style="display: none;">
              <option value="">-- 使用默认模型配置 --</option>
            </select>
            <input id="chat-use-default-model" type="hidden" value="true">

            <div class="card chat-box">
              <div id="chat-messages" class="chat-messages">
                <div class="chat-welcome">
                  <p>开始提问吧！基于知识库的智能问答系统已就绪。</p>
                </div>
              </div>
            </div>

            <form id="chat-form" class="chat-input-container">
              <div class="chat-toolbar">
                <button type="button" class="toolbar-btn" id="chat-attach-btn" title="附件">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 0 18.8-4.3M22 12.5a10 10 0 0 0-18.8 2.2"/></svg>
                </button>
              </div>
              
              <textarea id="chat-query" class="chat-input" rows="1" placeholder="输入您的问题..." required></textarea>
              
              <div class="chat-controls">
                <label class="control-item" title="启用深度思考">
                  <input type="checkbox" id="chat-deep-think" checked>
                  <span>🧠</span>
                </label>
                <label class="control-item" title="网络搜索（开发中）">
                  <input type="checkbox" id="chat-web-search" disabled>
                  <span>🌐</span>
                </label>
              </div>
              
              <button type="submit" class="chat-send-btn" title="发送 (Ctrl+Enter)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16115819 C3.34915502,0.9040618 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99801575 L3.03521743,10.4390088 C3.03521743,10.5960618 3.19218622,10.753159 3.50612381,10.753159 L16.6915026,11.5386722 C16.6915026,11.5386722 17.1624089,11.5386722 17.1624089,12.0099644 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z"/></svg>
              </button>
            </form>
          </div>

          <aside class="card chat-sources">
            <div class="chat-sources-head">
              <h3 id="sources-title">知识来源</h3>
            </div>
            <div id="sources-list" class="sources-list">
              <div class="sources-empty">发起提问后将在这里展示命中文档</div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="source-dialog" class="dialog-backdrop" aria-hidden="true">
    <div class="dialog-panel source-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="source-dialog-title">
      <header class="dialog-header">
        <div>
          <p id="source-dialog-subtitle" class="dialog-subtitle">来源详情</p>
          <h3 id="source-dialog-title">知识来源</h3>
        </div>
        <button id="source-dialog-close" class="dialog-close" type="button" aria-label="关闭">&times;</button>
      </header>
      <div class="dialog-body">
        <pre id="source-dialog-content" class="mono source-dialog-content"></pre>
      </div>
      <footer class="dialog-footer">
        <button id="source-dialog-cancel" class="btn" type="button">关闭</button>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js" defer></script>
  <script src="/ui/app.js" defer></script>
</body>
</html>
