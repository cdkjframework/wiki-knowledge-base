<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型管理 - WIKI本地知识库控制台</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="bg-layer"></div>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.png" alt="WIKI logo">
        <div>
          <h1>WIKI本地知识库控制台</h1>
          <p>本地知识库工作台</p>
        </div>
      </div>
      <nav class="menu">
        <a class="menu-item" href="/ui/">聊天</a>
        <a class="menu-item" href="/ui/kb.html">知识库管理</a>
        <a class="menu-item active" href="/ui/model.html">模型管理</a>
      </nav>
      <a class="doc-link" href="/api-docs" target="_blank" rel="noreferrer">查看 API 文档</a>
    </aside>

    <section class="content">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <header class="panel-head">
        <h2>模型控制管理</h2>
        <p>管理模型配置、切换默认配置，并进行连通性测试。</p>
      </header>

      <div class="card row-actions">
        <button id="btn-add-model" class="btn primary size-small">新增模型</button>
        <button id="btn-refresh-model-configs" class="btn size-small">刷新配置</button>
        <button id="btn-bootstrap-model-configs" class="btn size-small">初始化预设配置</button>
      </div>

      <div class="card" style="height: calc(100vh - 300px);" id="model-configs-section">
        <h3>配置列表</h3>
        <table class="table" id="model-configs-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>名称</th>
              <th>服务商</th>
              <th>模型</th>
              <th>状态</th>
              <th>默认</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="model-configs-tbody">
            <tr><td colspan="7">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 模型配置模态框 -->
  <div id="model-config-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">新增模型配置</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <form id="model-config-form" class="form-grid">
        <input id="model-config-id" type="hidden">

        <label class="field size-small">
          <span>名称</span>
          <input id="model-name" type="text" placeholder="my-model" required>
        </label>
        <label class="field size-small">
          <span>服务商</span>
          <select id="model-provider" required></select>
        </label>
        <label class="field full">
          <span>接口地址</span>
          <input id="model-base-url" type="text" placeholder="https://api.openai.com/v1" required>
        </label>
        <label class="field size-small">
          <span>模型名称</span>
          <input id="model-model-name" type="text" placeholder="gpt-4o-mini" required>
        </label>
        <label class="field size-small">
          <span>API 密钥</span>
          <input id="model-api-key" type="password" placeholder="可留空">
        </label>
        <label class="field size-small">
          <span>温度 temperature</span>
          <input id="model-temperature" type="number" step="0.1" value="0.7">
        </label>
        <label class="field size-small">
          <span>max_tokens</span>
          <input id="model-max-tokens" type="number" min="1" placeholder="可选">
        </label>
        <label class="field size-small">
          <span>timeout(秒)</span>
          <input id="model-timeout" type="number" step="0.5" value="30">
        </label>
        <label class="field full">
          <span>描述</span>
          <input id="model-description" type="text" placeholder="可选描述">
        </label>
        <label class="field checkbox-field">
          <input id="model-is-active" type="checkbox" checked>
          <span>启用</span>
        </label>
        <label class="field checkbox-field">
          <input id="model-is-default" type="checkbox">
          <span>设为默认</span>
        </label>

        <div class="actions full">
          <button type="submit" class="btn primary size-small">保存配置</button>
          <button id="btn-cancel-modal" type="button" class="btn size-small">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/ui/app.js" defer></script>
</body>
</html>
